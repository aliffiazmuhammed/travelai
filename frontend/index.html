<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>waytowalk — Real journeys. Your way.</title>
    <meta name="description" content="Discover real trips and travel agencies, adapt the route with your group, and keep the plan, map, weather and budget together." />
    <meta name="author" content="waytowalk" />
    <meta name="theme-color" content="#173F35" />
    <link rel="icon" type="image/svg+xml" href="/brand/waytowalk-symbol.svg" />

    <!-- OpenGraph / Social Sharing -->
    <meta property="og:title" content="waytowalk — Real journeys. Your way." />
    <meta property="og:description" content="Discover real trips, plan together, and make every journey your own with waytowalk." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="waytowalk" />
    <!-- The backend SPA fallback rewrites this to an absolute URL and swaps in
         the shared trip's cover when one exists (C-20). -->
    <meta property="og:image" content="/brand/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="waytowalk — Real journeys. Your way." />
    <meta name="twitter:description" content="Discover real trips, plan together, and make every journey your own with waytowalk." />
    <meta name="twitter:image" content="/brand/og-default.png" />

    <!-- Typography is self-hosted variable Manrope + Newsreader (see
         src/styles/typography.css); no third-party font origins needed. -->

    <!-- Prevent Theme Flash (external so CSP can forbid inline scripts) -->
    <script src="/theme-init.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
