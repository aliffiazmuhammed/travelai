name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, types and builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The env schema validates at import time. These placeholders satisfy it
    # without connecting to MongoDB or calling any provider.
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/travelai_ci
      JWT_SECRET: ci-test-only-secret-not-used-outside-the-unit-suite
      GEMINI_API_KEY: ci-test-placeholder

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Unit tests are dependency-free: no Mongo, no provider keys.
      - name: Backend tests
        run: npm run test:backend

      - name: Backend build
        run: npm run build:backend

      - name: Frontend typecheck
        run: npm run typecheck --workspace=frontend

      # Builds the SPA without copying over backend/public; the mirror is a
      # deploy artifact, not something CI should mutate in the checkout.
      - name: Frontend build
        run: npm run build --workspace=frontend
