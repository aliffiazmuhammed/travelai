services:
  # ==========================================================
  # OPTION 1 (RECOMMENDED): UNIFIED SINGLE WEB SERVICE
  # Serves both Express API & React Frontend on 1 Render Instance
  # - 100% Free Tier Friendly (Uses 1 instance slot)
  # - Zero CORS issues (same origin / domain)
  # - First-party secure auth cookies across all browsers
  # ==========================================================
  - type: web
    name: travelai-app
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a secure random secret
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false # Optional: Set in Render Dashboard
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SERVE_STATIC
        value: "true"

