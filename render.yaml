services:
  # ==========================================================
  # BACKEND WEB SERVICE (Express API)
  # ==========================================================
  - type: web
    name: travelai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set this in Render dashboard
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a cryptographically secure key
      - key: GEMINI_API_KEY
        sync: false # Set this in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false # Optional: Set in Render dashboard
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: FRONTEND_URL
        fromService:
          type: web
          name: travelai-frontend
          property: host

  # ==========================================================
  # FRONTEND STATIC SITE (Vite + React)
  # ==========================================================
  - type: web
    name: travelai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Single-Page Application (SPA) client-side routing
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: travelai-backend
          property: host
